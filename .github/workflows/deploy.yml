name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Copy files to Oracle Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "."
          target: "/home/ubuntu/music-discovery"

      - name: Build and Deploy via Docker Compose
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /home/ubuntu/music-discovery
            
            # Create .env from example if it doesn't exist
            if [ ! -f .env ]; then
              cp .env.example .env
            fi

            # Caddy must receive the public hostname to issue and serve TLS.
            sed -i 's|^DOMAIN=.*|DOMAIN=moodalbum.com|' .env

            # Oracle's security list permits web traffic. If UFW is enabled on
            # the instance, allow the same ports at the host level as well.
            if command -v ufw >/dev/null 2>&1 && ufw status | grep -q 'Status: active'; then
              sudo ufw allow 80/tcp
              sudo ufw allow 443/tcp
            fi
            
            # Build and run the docker containers
            docker compose up -d --build

            # Fail the deployment if the public reverse proxy did not start.
            docker compose ps caddy
            
            # Clean up dangling images to save space on the micro instance
            docker image prune -f
