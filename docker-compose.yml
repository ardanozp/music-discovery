version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # 1. PostgreSQL Database Service
  # ----------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: moodalbum-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-moodalbum}
      POSTGRES_USER: ${POSTGRES_USER:-moodalbum_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-moodalbum_user} -d $${POSTGRES_DB:-moodalbum}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # 2. MoodAlbum API + Angular SPA Application Service
  # ----------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: moodalbum-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Standard ASP.NET Core connection string mapping
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=${POSTGRES_DB:-moodalbum};Username=${POSTGRES_USER:-moodalbum_user};Password=${POSTGRES_PASSWORD:-change_me_in_production}"
      # Trust reverse proxy on docker network
      ReverseProxy__KnownProxies__0: "*"
    expose:
      - "80"
    networks:
      - internal-net

  # ----------------------------------------------------------------------------
  # 3. Caddy Reverse Proxy & Automatic SSL Service
  # ----------------------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    container_name: moodalbum-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3 QUIC support
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data    # Persists Let's Encrypt certificates
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    depends_on:
      - api
    networks:
      - internal-net

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  internal-net:
    driver: bridge
